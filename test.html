<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทดสอบสร้าง Word ด้วย Template</title>

    <!-- Tailwind CSS สำหรับจัดหน้าตาให้ดูง่าย -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; } </style>

    <!-- Libraries ที่ต้องใช้ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pizzip/3.1.4/pizzip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
        <h1 class="text-2xl font-bold text-blue-700 mb-6 border-b pb-4">ทดสอบดึง Word Template มาแทนที่คำ</h1>

        <!-- ส่วนที่ 1: อัปโหลด Template -->
        <div class="mb-8 bg-blue-50 p-4 rounded-xl border border-blue-100">
            <h2 class="text-lg font-semibold text-blue-800 mb-2">1. เลือกไฟล์ Template (.docx)</h2>
            <p class="text-sm text-blue-600 mb-3">
                *ในไฟล์ Word ต้นฉบับของคุณ ต้องมีคำเหล่านี้อยู่:<br>
                <b>{target_school}</b>, <b>{guardian_name}</b>, <b>{address}</b>, 
                <b>{student_name}</b>, <b>{class_level}</b>, <b>{citizen_id}</b>
            </p>
            <input type="file" id="templateFile" accept=".docx" class="block w-full text-sm text-slate-500
              file:mr-4 file:py-2 file:px-4
              file:rounded-full file:border-0
              file:text-sm file:font-semibold
              file:bg-blue-600 file:text-white
              hover:file:bg-blue-700 cursor-pointer
            "/>
        </div>

        <!-- ส่วนที่ 2: จำลองการกรอกข้อมูล -->
        <div class="mb-8">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">2. ข้อมูลจำลองที่จะเอาไปแทนที่</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">โรงเรียนปลายทาง ({target_school})</label>
                    <input type="text" id="target_school" value="โรงเรียนเทศบาล ๗ (วัดแก่งขนุน)" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">ชื่อผู้ปกครอง ({guardian_name})</label>
                    <input type="text" id="guardian_name" value="นายสมชาย ใจดี" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-600 mb-1">ที่อยู่ ({address})</label>
                    <input type="text" id="address" value="๒๖ หมู่ที่ ๕ ต.หินดาด อ.ด่านขุนทด จ.นครราชสีมา" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">ชื่อนักเรียน ({student_name})</label>
                    <input type="text" id="student_name" value="เด็กชายสันติพงษ์ แวงมั่ง" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">ชั้นเรียน ({class_level})</label>
                    <input type="text" id="class_level" value="ประถมศึกษาปีที่ ๑" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">เลข ปชช. ({citizen_id})</label>
                    <input type="text" id="citizen_id" value="๑ ๓๐๙๕ ๐๐๐๙๙ ๕๒ ๒" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
        </div>

        <!-- ส่วนที่ 3: ปุ่มกดสร้างไฟล์ -->
        <button onclick="generateWord()" id="btnSubmit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-700 transition-colors shadow-md">
            สร้างไฟล์ Word จาก Template
        </button>

        <p id="statusMsg" class="mt-4 text-center text-sm font-medium hidden"></p>
    </div>

    <script>
        function generateWord() {
            const fileInput = document.getElementById("templateFile");
            const statusMsg = document.getElementById("statusMsg");
            const btnSubmit = document.getElementById("btnSubmit");

            // เช็คว่าผู้ใช้เลือกไฟล์หรือยัง
            if (fileInput.files.length === 0) {
                statusMsg.textContent = "❌ กรุณาเลือกไฟล์ Template ก่อนครับ";
                statusMsg.className = "mt-4 text-center text-sm font-medium text-red-500 block";
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            btnSubmit.innerText = "กำลังสร้างเอกสาร...";
            btnSubmit.disabled = true;

            // เมื่ออ่านไฟล์เสร็จ ให้ทำตามนี้
            reader.onload = function(event) {
                try {
                    const arrayBuffer = event.target.result;
                    
                    // 1. นำไฟล์ที่อ่านได้เข้า PizZip
                    const zip = new PizZip(arrayBuffer);
                    
                    // 2. ตั้งค่า docxtemplater
                    const doc = new window.docxtemplater(zip, {
                        paragraphLoop: true,
                        linebreaks: true,
                    });

                    // 3. ดึงข้อมูลจากฟอร์มมาเตรียมไว้
                    const templateData = {
                        target_school: document.getElementById("target_school").value,
                        guardian_name: document.getElementById("guardian_name").value,
                        address: document.getElementById("address").value,
                        student_name: document.getElementById("student_name").value,
                        class_level: document.getElementById("class_level").value,
                        citizen_id: document.getElementById("citizen_id").value,
                    };

                    // 4. สั่งแทนที่คำ (Render)
                    doc.render(templateData);

                    // 5. นำไฟล์ที่แทนที่แล้ว ออกมาเป็น Blob (ไฟล์)
                    const out = doc.getZip().generate({
                        type: "blob",
                        mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                    });

                    // 6. โหลดลงเครื่องผู้ใช้
                    saveAs(out, "จดหมายส่งตัว(จากTemplate).docx");

                    // คืนสถานะปุ่ม
                    statusMsg.textContent = "✅ สร้างไฟล์สำเร็จแล้ว!";
                    statusMsg.className = "mt-4 text-center text-sm font-medium text-green-600 block";
                    btnSubmit.innerText = "สร้างไฟล์ Word จาก Template";
                    btnSubmit.disabled = false;

                } catch (error) {
                    console.error(error);
                    statusMsg.textContent = "❌ เกิดข้อผิดพลาด: " + error.message;
                    statusMsg.className = "mt-4 text-center text-sm font-medium text-red-500 block";
                    btnSubmit.innerText = "สร้างไฟล์ Word จาก Template";
                    btnSubmit.disabled = false;
                }
            };

            // สั่งเริ่มอ่านไฟล์
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
